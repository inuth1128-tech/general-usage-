<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 사무실</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#0e1320;color:#e8ecf5;font:14px/1.4 system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{display:flex;align-items:center;gap:10px 14px;padding:8px 14px;background:#121a2b;border-bottom:1px solid #243049;flex-wrap:wrap}
h1{font-size:16px;margin:0;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;background:#1d2940;color:#b9c4da;border:1px solid #2c3b59}
.pill i{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block}
.pill.stale{background:#3a2a0c;border-color:#8a6416;color:#ffd48a}.pill.stale i{background:#f59e0b}
.pill.over{background:#1c2140;border-color:#3b4a8a;color:#aab8ff}
.sp{flex:1}
header button{font:inherit;font-size:12px;background:#1d2940;color:#dbe4f7;border:1px solid #2c3b59;border-radius:8px;padding:3px 10px;cursor:pointer}
header button:hover{background:#26375a}
header button[hidden]{display:none}
main{display:grid;grid-template-columns:92px 1fr;min-height:0}
nav{background:#101727;border-right:1px solid #243049;display:flex;flex-direction:column;gap:6px;padding:8px 6px;overflow-y:auto}
.ind{background:#05080f;border:1px solid #2c3b59;border-radius:8px;text-align:center;padding:6px 2px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.ind .arr{display:block;font-size:12px;color:#ffb84d;height:16px}
.ind b{font-size:20px;color:#ffcf7a;font-family:ui-monospace,Menlo,Consolas,monospace}
.fb{font:inherit;color:#cfd8ea;background:#18223a;border:1px solid #2a3a5c;border-radius:10px;padding:7px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;min-height:54px;justify-content:center}
.fb:hover{background:#21304f}
.fb.on{background:#ffb84d;color:#2a1c00;border-color:#ffd48a}
.fb .fn{font-weight:700;font-size:14px}
.fb .fs{font-size:10.5px;opacity:.8;max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb .bd{font-size:10.5px;margin-top:1px}
.vp{position:relative;overflow:hidden;min-height:0;background:#0b101c}
.shaft{position:absolute;left:0;top:0;width:100%;transition:transform var(--dur,0ms) cubic-bezier(.65,0,.25,1);will-change:transform}
.floor{position:absolute;left:0;width:100%;overflow:hidden;background:linear-gradient(#1b2336,#121827)}
.floor.f-ceo{background:linear-gradient(#2a1d33,#171221)}
.floor.f-work.lobby{background:linear-gradient(#2a2a3a,#171a26)}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:#2b364f}
.floor::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:#2b364f}
.fl{position:absolute;left:16px;top:14px;z-index:5;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;pointer-events:none}
.fl b{font-size:26px;color:#fff;text-shadow:0 2px 8px #000a}
.fl span{font-size:15px;color:#cdd6ea}
.fl em{font-style:normal;font-size:12px;color:#ffd48a;background:#0007;border-radius:99px;padding:1px 8px}
.fl em:empty{display:none}
.scene{position:absolute;left:50%;top:50%;width:800px;height:520px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}
.scene>img.bg{position:absolute;left:0;top:0;width:800px;height:520px;display:block;user-select:none;-webkit-user-drag:none}
.actors{position:absolute;inset:0}
.doorfx{position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(#fff8c8,#ffd16000 70%);opacity:0;pointer-events:none;z-index:3}
.lights{position:absolute;inset:0;pointer-events:none;z-index:99999;width:800px;height:520px}
.room{fill:#050a22;opacity:0;transition:opacity .9s}
.room.off{opacity:.62}
.room.nt{transition:none}

/* people */
.person{position:absolute;width:48px;height:64px}
.spr{position:absolute;inset:0;background-size:400% 300%;image-rendering:pixelated;background-repeat:no-repeat}
.spr.anim{animation:flip .5s linear infinite}
.spr.slow{animation-duration:2.2s}
.spr.fast{animation-duration:.36s}
@keyframes flip{0%,49.99%{background-position:var(--ax) var(--ay)}50%,100%{background-position:var(--bx) var(--by)}}
.pal0{background-image:var(--sh0)}.pal1{background-image:var(--sh1)}.pal2{background-image:var(--sh2)}.pal3{background-image:var(--sh3)}.pal4{background-image:var(--sh4)}.pal5{background-image:var(--sh5)}.pal6{background-image:var(--sh6)}
.person.away .spr{opacity:.18;filter:grayscale(1)}
.tag{position:absolute;top:66px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;line-height:1.2;background:#0b1020d9;color:#fff;border-radius:5px;padding:1px 5px;display:flex;gap:4px;pointer-events:none;max-width:130px}
.tag b{font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.tag i{font-style:normal;color:#ffd48a}
.person.away .tag{background:#2b1d40d9}
.fx{position:absolute;left:0;right:0;top:8px;height:30px;pointer-events:none}
.person.tall .fx{top:-6px}
.fx span{position:absolute;font-size:12px;line-height:1}
.sw.s1{right:6px;top:6px;animation:drip 1.1s ease-in infinite}
.sw.s2{left:6px;top:10px;animation:drip 1.1s ease-in .5s infinite}
.sw.s3{right:-2px;top:16px;animation:drip 1.1s ease-in .25s infinite}
@keyframes drip{0%{transform:translateY(-3px);opacity:0}25%{opacity:1}100%{transform:translateY(14px);opacity:0}}
.st{animation:twinkle .9s ease-in-out infinite}
.st.a{left:-4px;top:-4px}.st.b{right:-4px;top:-8px;animation-delay:.3s}.st.c{left:18px;top:-14px;animation-delay:.6s}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.6}50%{transform:scale(1.25) rotate(20deg);opacity:1}}
.cup{right:-6px;top:6px;font-size:11px}
.zz{left:28px;top:-6px;font-size:13px;animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{transform:translate(0,8px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(8px,-12px) scale(1.1);opacity:0}}
.q{left:16px;top:-2px;font-size:16px}
.bub{position:absolute;left:50%;bottom:100%;transform:translateX(-50%) translateY(2px);background:#fff;color:#1a1f2b;font-size:11px;font-weight:600;padding:3px 8px;border-radius:9px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .18s;pointer-events:none;z-index:2;box-shadow:0 2px 6px #0006}
.bub.on{opacity:1}
.bub::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:#fff;transform:translateX(-50%) rotate(45deg);z-index:-1}
.chk{display:none;position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:10px;font-weight:700;color:#3a2600;background:#ffc94d;border-radius:99px;padding:0 6px;white-space:nowrap;z-index:3}
.person.tall .chk{top:-4px}

/* stale = 확인 중 */
.vp.stale .scene{filter:grayscale(.8) brightness(.78)}
.vp.stale .fx{display:none}
.vp.stale .chk{display:block}
.vp.stale .bub{display:none}
.banner{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;background:#ffc94d;color:#2d1d00;font-weight:700;border-radius:12px;padding:8px 16px;box-shadow:0 6px 24px #0008;display:none;max-width:92%;text-align:center;font-size:13px}
.vp.stale .banner{display:block}
.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;color:#b9c4da;display:none;text-align:center;font-size:14px;pointer-events:none}
@media (max-width:620px){
  main{grid-template-columns:64px 1fr}
  .fb .fs{display:none}.fb{min-height:46px}
  .fl b{font-size:20px}
}
@media (prefers-reduced-motion:reduce){.shaft{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>🏢 AI 사무실</h1>
  <span class="pill" id="live"><i></i><span id="liveTxt">확인 중</span></span>
  <span class="pill" id="over" hidden>🌙 퇴근 시간</span>
  <span id="sum" style="font-size:12px;color:#9fb0cd"></span>
  <span class="sp"></span>
  <span id="clock" style="font-size:12px;color:#9fb0cd"></span>
  <button id="cut" hidden>자료 끊기(테스트)</button>
  <button id="demoBtn">데모 보기</button>
</header>
<main>
  <nav id="nav"><div class="ind" id="ind"><span class="arr" id="arr"></span><b id="indn">1F</b></div><div id="btns" style="display:contents"></div></nav>
  <section class="vp" id="vp">
    <div class="shaft" id="shaft"></div>
    <div class="empty" id="empty"></div>
    <div class="banner" id="banner">확인 중…</div>
  </section>
</main>

<script>
/* ============================================================
   AI 사무실 — 상태 JSON(state.json)을 1초마다 읽어 그린다.
   데이터 형식은 README.md 참고.
   ============================================================ */
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const params=new URLSearchParams(location.search);
const SRC=params.get('src')||'state.json';
let DEMO=params.has('demo');
const STALE_MS=5000, LONG_MIN=40, SPEED=120;       // 5초 / 40분 / 걷는 속도(px/s)
const SWEAT_WAIT=3, CROUCH_WAIT=10;               // 질문 대기 분 (땀 / 쪼그려 앉기)
const ENDED=['done','ended','left','closed'];

/* ---------- 등각 좌표 ---------- */
const TW=64,TH=32,CX=400,Y0=118,WH=100;
const P=(x,y,z=0)=>[CX+(x-y)*TW/2, Y0+(x+y)*TH/2-z];
const DOOR=P(0.9,6,0);                              // 엘리베이터 앞
function slotGeom(i){const r=i>>2,k=i&3,ox=(r&1)*6,oy=(r>>1)*6,c=k&1,w=k>>1;
  const dx=ox+0.8+c*2.6,dy=oy+0.9+w*2.6,aisle=ox+3.1;
  return {r,dx,dy,aisle,anchor:P(dx+1,dy-0.4,8),
    path:[DOOR,P(aisle,6,0),P(aisle,dy-0.4,0),P(dx+1,dy-0.4,8)]};}
const SLOTS=16;
const CEO_ANCHOR=P(9.5,1.0,8);
function queueAnchor(i){const row=i>=5?1:0,k=i%5;return P(8.6-k*1.6,6.8+row*1.5,0);}
const QMAX=10;

/* ---------- 색 ---------- */
function sh(hex,f){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(f>=0?v+(255-v)*f:v*(1+f))));return `rgb(${m(r)},${m(g)},${m(b)})`;}
const colr=h=>({t:sh(h,.2),l:sh(h,-.1),r:sh(h,-.26)});

/* ============================================================
   등각 사무실 그림 (SVG 1장 × 모드 2종: 일반 / 대표실)
   ============================================================ */
function officeSVG(mode){
  const ceo=mode==='ceo', out=[], objs=[];
  const poly=(a,fill,ex='')=>`<polygon points="${a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="${fill}" ${ex}/>`;
  const box=(x,y,w,d,h,c,z0=0)=>{
    const top=[P(x,y,z0+h),P(x+w,y,z0+h),P(x+w,y+d,z0+h),P(x,y+d,z0+h)];
    const lf=[P(x,y+d,z0),P(x+w,y+d,z0),P(x+w,y+d,z0+h),P(x,y+d,z0+h)];
    const rt=[P(x+w,y,z0),P(x+w,y+d,z0),P(x+w,y+d,z0+h),P(x+w,y,z0+h)];
    return poly(lf,c.l)+poly(rt,c.r)+poly(top,c.t);};
  const add=(d,s)=>objs.push({d,s});
  // 바닥 두께
  out.push(poly([P(0,12,0),P(12,12,0),P(12,12,-16),P(0,12,-16)],'#4a5163'));
  out.push(poly([P(12,0,0),P(12,12,0),P(12,12,-16),P(12,0,-16)],'#363c4b'));
  // 바닥 타일
  const RC=['#a9bccb','#bccba5','#d3c3a8','#c3b5d3'];
  for(let i=0;i<12;i++)for(let j=0;j<12;j++){
    let base;
    if(ceo){ if(i>=6&&j<6)base='#7b2f3d'; else if(j>=6&&j<8&&i<10)base='#9a4450'; else base='#d8d3c8'; }
    else base=RC[(j>=6?2:0)+(i>=6?1:0)];
    out.push(poly([P(i,j),P(i+1,j),P(i+1,j+1),P(i,j+1)],(i+j)&1?sh(base,.05):base,'stroke="rgba(0,0,0,.07)" stroke-width=".6"'));
  }
  // 벽
  const wl=ceo?'#d2c3b0':'#ddd6c8', wr=ceo?'#c2b19c':'#cdc5b4';
  out.push(poly([P(0,0,0),P(0,12,0),P(0,12,WH),P(0,0,WH)],wl));
  out.push(poly([P(0,0,0),P(12,0,0),P(12,0,WH),P(0,0,WH)],wr));
  out.push(poly([P(0,0,0),P(0,12,0),P(0,12,7),P(0,0,7)],'rgba(0,0,0,.14)'));
  out.push(poly([P(0,0,0),P(12,0,0),P(12,0,7),P(0,0,7)],'rgba(0,0,0,.18)'));
  out.push(`<polyline points="${[P(0,12,WH),P(0,0,WH),P(12,0,WH)].map(p=>p.join(',')).join(' ')}" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="2"/>`);
  const wq=(pl,a1,a2,z1,z2,fill,ex='')=>poly(pl==='x'?[P(0,a1,z1),P(0,a2,z1),P(0,a2,z2),P(0,a1,z2)]:[P(a1,0,z1),P(a2,0,z1),P(a2,0,z2),P(a1,0,z2)],fill,ex);
  const win=(pl,a1,a2)=>{out.push(wq(pl,a1,a2,38,86,'url(#sky)','stroke="#8a93a0" stroke-width="2.5"'));
    const m=(a1+a2)/2; out.push(wq(pl,m-.03,m+.03,38,86,'#8a93a0'));};
  win('x',1.2,3.8);win('x',8.2,10.8);
  win('y',1.2,4.2);win('y',4.8,7.8); if(!ceo)win('y',8.4,11);
  // 엘리베이터 문 (왼쪽 벽)
  out.push(wq('x',5.1,6.9,0,78,'#58616f'));
  out.push(wq('x',5.22,5.98,0,72,'#b3bcc8'));
  out.push(wq('x',6.02,6.78,0,72,'#a2abb8'));
  const lp=P(0,6,86); out.push(`<circle cx="${lp[0]}" cy="${lp[1]}" r="4" fill="#ffb84d"/>`);
  // 물건들
  const wood=colr('#b0865a'),dk=colr('#2d3446');
  const plant=(x,y,s=1)=>{const b=P(x+.25,y+.25,10);
    add(x+y+1,box(x,y,.5,.5,10,colr('#8a5a3c'))+
      `<ellipse cx="${b[0]}" cy="${b[1]-14*s}" rx="${15*s}" ry="${12*s}" fill="#2f8f55"/><ellipse cx="${b[0]+5}" cy="${b[1]-20*s}" rx="${10*s}" ry="${9*s}" fill="#49b36e"/><ellipse cx="${b[0]-6}" cy="${b[1]-10*s}" rx="${8*s}" ry="${7*s}" fill="#237a47"/>`);};
  const glass={t:'rgba(210,240,250,.5)',l:'rgba(170,215,235,.42)',r:'rgba(140,195,222,.42)'};
  if(!ceo){
    for(let i=0;i<SLOTS;i++){const g=slotGeom(i),{dx,dy}=g;
      add(dx+dy+.9,box(dx+.7,dy-.9,.6,.6,10,dk));
      let s=box(dx,dy,2,1.1,14,wood)+box(dx+.6,dy+.12,.8,.3,.6,colr('#e6e8ee'),14)+
        box(dx+.85,dy+.55,.3,.2,2,colr('#222a36'),14)+box(dx+.3,dy+.62,1.4,.1,14,colr('#2a3240'),16);
      if(i%3===0)s+=box(dx+1.6,dy+.2,.25,.25,5,colr(['#e4572e','#3a86ff','#f4b400','#2ec4b6'][i%4]),14);
      if(i%4===1)s+=box(dx+.1,dy+.2,.4,.5,1.2,colr('#f5f5f0'),14);
      add(dx+dy+3.1,s);
    }
    for(const [a,b] of [[0,2.6],[3.6,8.6],[9.6,12]]){
      add(6.2+b,box(5.94,a,.12,b-a,26,glass));
      add(a+6.2+(b-a),box(a,5.94,b-a,.12,26,glass));}
    plant(.3,.3);plant(11.2,.3);plant(.3,11.2);plant(11.2,11.2);plant(5.4,5.4,.8);
  }else{
    // 대표실
    const brown=colr('#8a6a52');
    add(5,box(6,0,.1,6,30,brown)); // (안쪽 벽 옆은 가려지지 않게 낮게)
    add(12.5,box(5.9,5.9,.95,.2,30,brown));
    add(18,box(9.15,5.9,2.85,.2,30,brown));
    add(20,box(5.9,0,.2,5.9,30,{t:'rgba(210,240,250,.5)',l:'rgba(170,215,235,.42)',r:'rgba(140,195,222,.42)'}));
    add(8,box(9.2,.05,2.6,.6,52,colr('#6b4a33')));
    for(let k=0;k<6;k++)add(8.3,box(9.3+k*.42,.12,.3,.3,10+(k%3)*3,colr(['#e4572e','#3a86ff','#f4b400','#2ec4b6','#8a5cf6','#ef476f'][k]),30));
    add(12,box(7.4,1.4,3.6,1.5,18,colr('#5b3a29')));
    add(12.1,box(8.9,1.5,.5,.2,2,colr('#222a36'),18)+box(8.2,1.6,1.9,.1,14,colr('#2a3240'),20)+box(8.6,2.3,.8,.3,1,colr('#d4a017'),18));
    add(2.2,box(8.9,.4,.8,.8,12,colr('#1c1f2b')));
    plant(11.1,.9);plant(6.4,.5);
    // 문틀 + 간판
    add(12.8,box(6.85,5.85,.2,.3,60,colr('#3d2b20'))+box(8.95,5.85,.2,.3,60,colr('#3d2b20'))+box(6.85,5.85,2.3,.3,10,colr('#3d2b20'),60));
    const sp=P(7.0,6.1,64);
    add(40,`<text transform="matrix(1,.5,0,1,${sp[0].toFixed(1)},${sp[1].toFixed(1)})" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="9.5" font-weight="700" fill="#ffd48a">대표실</text>`);
    // 대기실
    add(34,box(.8,9.2,3.2,1.3,12,colr('#4a6fa5'))+box(.8,10.5,3.2,.35,26,colr('#3f6094')));
    add(40,box(6.4,9.6,3.2,1.3,12,colr('#4a6fa5'))+box(6.4,10.9,3.2,.35,26,colr('#3f6094')));
    add(20,box(4.4,9.4,1.2,.8,6,colr('#caa57a')));
    plant(.3,.3);plant(11.3,11.2);plant(5.4,11.1,.9);
  }
  objs.sort((a,b)=>a.d-b.d);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ec9ee"/><stop offset="1" stop-color="#e6f5fc"/></linearGradient></defs>${out.join('')}${objs.map(o=>o.s).join('')}</svg>`;
}
const IMG={};
const imgUrl=m=>IMG[m]||(IMG[m]=URL.createObjectURL(new Blob([officeSVG(m)],{type:'image/svg+xml'})));

/* ============================================================
   캐릭터 스프라이트 시트 (4열 × 3행, 칸 24×32px)
   0 타자A 1 타자B 2 졸음 3 커피 / 4 서기 5 걷기A 6 걷기B 7 만세A /
   8 쪼그림 9 만세B 10 손흔들기 11 고민
   ============================================================ */
const PALS=[
 {skin:'#f2c9a5',hair:'#3b2a20',shirt:'#e4572e',pants:'#37405a'},
 {skin:'#e9b88f',hair:'#1a1a1a',shirt:'#3a86ff',pants:'#2f3a52'},
 {skin:'#c98f66',hair:'#2a1c14',shirt:'#2ec4b6',pants:'#3a3f55'},
 {skin:'#f5d0b0',hair:'#b5651d',shirt:'#f4b400',pants:'#44506b'},
 {skin:'#d9a07a',hair:'#5a2d82',shirt:'#8a5cf6',pants:'#2f3a52'},
 {skin:'#a8704c',hair:'#111111',shirt:'#ef476f',pants:'#373f57'},
 {skin:'#f2c9a5',hair:'#222222',shirt:'#1d2433',pants:'#141922',acc:'#d4a017'}];
function drawFrame(g,ox,oy,pal,f){
  const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(ox+x,oy+y,w,h);};
  const {skin,hair,shirt,pants,acc}=pal,shoe='#1b1f2a',dk='#2a1f1a';
  const head=(hy,eyes='open',mouth='smile')=>{
    R(8,hy,8,8,skin);R(8,hy-1,8,3,hair);R(7,hy,1,4,hair);R(16,hy,1,4,hair);
    if(eyes==='open'){R(10,hy+4,1,2,dk);R(13,hy+4,1,2,dk);}
    else if(eyes==='closed'){R(10,hy+5,2,1,dk);R(13,hy+5,2,1,dk);}
    else {R(10,hy+4,2,1,dk);R(13,hy+4,2,1,dk);R(9,hy+3,1,1,dk);R(15,hy+3,1,1,dk);}
    if(mouth==='smile')R(11,hy+6,2,1,'#b5523b');else if(mouth==='open')R(11,hy+6,2,2,'#7a2a22');else R(11,hy+7,2,1,'#b5523b');};
  const torso=(ty,h=9)=>{R(7,ty,10,h,shirt);if(acc)R(11,ty,2,Math.min(h,7),acc);};
  const hand=(x,y)=>R(x,y,2,2,skin);
  const seat=()=>R(7,29,10,3,pants);
  const legs=(l,r)=>{R(8,20,3,l,pants);R(13,20,3,r,pants);R(8,20+l,3,32-20-l,shoe);R(13,20+r,3,32-20-r,shoe);};
  switch(f){
    case 0:case 1:{torso(20);seat();head(12);R(5,21,2,5,shirt);R(17,21,2,5,shirt);
      hand(8,f?27:26);hand(14,f?26:27);break;}
    case 2:{torso(20);seat();R(5,21,2,6,shirt);R(17,21,2,6,shirt);hand(5,27);hand(17,27);head(16,'closed','flat');break;}
    case 3:{torso(20);seat();head(12);R(5,21,2,6,shirt);hand(5,27);R(17,21,2,4,shirt);hand(16,18);
      R(17,14,4,5,'#f4f1ea');R(17,14,4,1,'#6b3f26');R(21,15,1,3,'#f4f1ea');break;}
    case 4:{head(3);torso(11);R(5,11,2,8,shirt);R(17,11,2,8,shirt);hand(5,19);hand(17,19);legs(9,9);break;}
    case 5:case 6:{const a=f===5;head(3);torso(11);
      R(5,11,2,a?6:8,shirt);hand(5,a?17:19);R(17,11,2,a?8:6,shirt);hand(17,a?19:17);
      legs(a?6:9,a?9:6);break;}
    case 7:{torso(20);seat();R(5,9,2,12,shirt);hand(5,7);R(17,9,2,12,shirt);hand(17,7);head(12,'happy','open');break;}
    case 9:{torso(20);seat();R(5,17,2,4,shirt);R(3,13,2,4,shirt);hand(2,11);R(17,17,2,4,shirt);R(19,13,2,4,shirt);hand(20,11);head(11,'happy','open');break;}
    case 8:{R(7,22,10,6,shirt);R(6,27,12,3,pants);R(5,29,4,3,shoe);R(15,29,4,3,shoe);head(14,'closed','flat');
      R(5,22,2,6,shirt);R(17,22,2,6,shirt);hand(7,27);hand(15,27);break;}
    case 10:{head(3);torso(11);R(5,11,2,8,shirt);hand(5,19);R(17,3,2,9,shirt);hand(17,1);legs(9,9);break;}
    case 11:{torso(20);seat();R(5,21,2,6,shirt);hand(5,27);R(17,19,2,6,shirt);hand(16,15);head(12,'closed','flat');break;}
  }
}
function makeSheets(){

    for(let f=0;f<12;f++)drawFrame(g,(f&3)*24,(f>>2)*32,pal,f);

const FRAME=f=>[(f&3)*100/3+'%',(f>>2)*50+'%'];
function setFrames(spr,a,b,slow,fast){
  const [ax,ay]=FRAME(a);spr.style.setProperty('--ax',ax);spr.style.setProperty('--ay',ay);
  spr.style.backgroundPosition=`${ax} ${ay}`;
  if(b==null){spr.classList.remove('anim','slow','fast');return;}
  const [bx,by]=FRAME(b);spr.style.setProperty('--bx',bx);spr.style.setProperty('--by',by);
  spr.classList.add('anim');spr.classList.toggle('slow',!!slow);spr.classList.toggle('fast',!!fast);
  if(!spr.style.animationDelay)spr.style.animationDelay=(-Math.random()*.5)+'s';
}
const FX={
  sweat:'<span class="sw s1">💧</span><span class="sw s2">💧</span>',
  sweat2:'<span class="sw s1">💧</span><span class="sw s2">💧</span><span class="sw s3">💧</span>',

  rest:'<span class="cup">☕</span><span class="zz">💤</span>',
  away:'<span class="q">❓</span>'};
const TALL=[4,5,6,10];

/* ---------- 유틸 ---------- */
const toMs=v=>typeof v==='number'?v:Date.parse(v);
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);};
const palOf=k=>hash(k)%6;
const fmtMin=m=>m<1?'방금':m<60?`${Math.floor(m)}분`:`${Math.floor(m/60)}시간 ${Math.floor(m%60)}분`;
let stale=true;const deferred=[];
function later(fn,ms){return setTimeout(()=>{if(stale)deferred.push(fn);else fn();},ms);}

/* ============================================================
   층(View) = 등각 사무실 한 장 + 사람들
   ============================================================ */
class View{
  constructor(def,idx){
    this.def=def;this.id=def.id;this.mode=def.mode;this.idx=idx;
    this.people=new Map();this.slots=new Map();this.ready=false;this.overflow=0;
    const f=this.el=document.createElement('section');
    f.className='floor f-'+def.mode+(def.id==='__lobby'?' lobby':'');
    f.innerHTML=`<div class="fl"><b></b><span></span><em></em></div><div class="scene"><img class="bg" alt=""><div class="actors"></div><div class="doorfx"></div><svg class="lights" viewBox="0 0 800 520"></svg></div>`;
    $('b',f).textContent=def.label;$('span',f).textContent=def.name||'';
    this.meta=$('em',f);this.actors=$('.actors',f);this.doorfx=$('.doorfx',f);
    $('img',f).src=imgUrl(def.mode==='ceo'?'ceo':'work');
    const H=70,hexes=[];
    for(let r=0;r<4;r++){const ox=(r&1)*6,oy=(r>>1)*6;
      const pts=[P(ox,oy,H),P(ox+6,oy,H),P(ox+6,oy,0),P(ox+6,oy+6,0),P(ox,oy+6,0),P(ox,oy+6,H)];
      hexes.push(`<polygon class="room" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/>`);}
    $('.lights',f).innerHTML=hexes.join('');
    this.rooms=[...f.querySelectorAll('.room')];
    const d=P(0,6,40);this.doorfx.style.left=(d[0]-35)+'px';this.doorfx.style.top=(d[1]-35)+'px';
  }
  slotOf(key){
    if(this.slots.has(key))return this.slots.get(key);
    const used=new Set(this.slots.values());
    for(let i=0;i<SLOTS;i++)if(!used.has(i)){this.slots.set(key,i);return i;}
    return -1;}
  posFor(it){
    if(it.kind==='desk'){const s=this.slotOf(it.key);return s<0?null:{pos:slotGeom(s).anchor,path:slotGeom(s).path};}
    if(it.kind==='ceo')return {pos:CEO_ANCHOR};
    if(it.qi>=QMAX)return null;
    return {pos:queueAnchor(it.qi),path:[DOOR,queueAnchor(it.qi)]};}
  flash(){this.doorfx.animate([{opacity:0},{opacity:1},{opacity:0}],{duration:1000});}
  create(it){
    const el=document.createElement('div');el.className='person';
    el.innerHTML='<div class="bub"></div><div class="fx"></div><div class="chk">확인 중</div><div class="spr"></div><div class="tag"><b></b><i></i></div>';
    const p={key:it.key,el,view:this,spr:$('.spr',el),fx:$('.fx',el),bub:$('.bub',el),tb:$('.tag b',el),ti:$('.tag i',el),
      x:0,y:0,poseKey:'',pose:null,walking:false,leaving:false,anim:null,role:it.role,kind:it.kind,entry:null,bt:0};
    p.spr.classList.add('pal'+(it.kind==='ceo'?6:palOf(it.palKey||it.key)));
    this.actors.appendChild(el);return p;}
  reconcile(items){
    this.overflow=0;const seen=new Set();
    for(const it of items){
      const pp=this.posFor(it);
      if(!pp){this.overflow++;continue;}
      seen.add(it.key);
      let p=this.people.get(it.key);
      if(p&&p.leaving)continue;
      if(!p){
        p=this.create(it);this.people.set(it.key,p);p.entry=pp.path||null;
        if(this.ready&&it.enter&&pp.path&&!stale){
          setPos(p,DOOR[0],DOOR[1]);p.el.animate([{opacity:0},{opacity:1}],{duration:350});
          this.flash();if(it.greet)bubble(p,it.greet,it.kind==='queue'?4200:2600);
          p.pose=it.pose;
          walkTo(p,pp.path.slice(1),()=>refreshPose(p));
        }else setPos(p,pp.pos[0],pp.pos[1]);
      }else if(Math.abs(p.x-pp.pos[0])>.5||Math.abs(p.y-pp.pos[1])>.5){
        if(this.ready&&!stale)walkTo(p,[pp.pos],()=>refreshPose(p));else{cancelAnim(p);setPos(p,pp.pos[0],pp.pos[1]);}
      }
      p.role=it.role;p.pose=it.pose;
      p.tb.textContent=it.tagName||'';p.ti.textContent=it.tagInfo||'';
      p.el.title=it.title||'';p.el.classList.toggle('away',!!it.away);
      if(!p.walking)applyPose(p,it.pose);
    }
    for(const p of [...this.people.values()])if(!seen.has(p.key)&&!p.leaving)this.remove(p);
    this.ready=true;
    this.meta.textContent=this.overflow?`+${this.overflow}명은 자리가 없어요`:'';
  }
  dispose(p){cancelAnim(p);p.el.remove();this.people.delete(p.key);this.slots.delete(p.key);}
  fade(p){const a=p.el.animate([{opacity:1},{opacity:0}],{duration:420,fill:'forwards'});a.onfinish=()=>this.dispose(p);}
  remove(p){
    p.leaving=true;
    if(!this.ready||stale){this.dispose(p);return;}
    if(p.kind==='queue'){p.el.classList.remove('away');this.flash();walkTo(p,[DOOR],()=>this.fade(p));}
    else if(p.kind==='desk'&&p.role==='sub'){
      p.el.classList.remove('away');applyPose(p,{a:10});bubble(p,'퇴근합니다!',1700);
      later(()=>{const back=(p.entry||[DOOR]).slice(0,-1).reverse();this.flash();
        walkTo(p,back.length?back:[DOOR],()=>this.fade(p));},1300);
    }else this.fade(p);
  }
}
function setPos(p,x,y){p.x=x;p.y=y;p.el.style.left=(x-24)+'px';p.el.style.top=(y-64)+'px';p.el.style.zIndex=Math.round(y);
  p.el.classList.toggle('tall',TALL.includes(p.pose?p.pose.a:4)||p.walking);}
function curXY(p){const cs=getComputedStyle(p.el);return [parseFloat(cs.left)+24,parseFloat(cs.top)+64];}
function cancelAnim(p){if(p.anim){const a=p.anim;p.anim=null;a.cancel();}p.walking=false;p.el.classList.remove('walking');}
function applyPose(p,pose){
  if(!pose)return;const k=JSON.stringify(pose);if(p.poseKey===k)return;p.poseKey=k;
  setFrames(p.spr,pose.a,pose.b,pose.slow,false);
  p.el.classList.toggle('tall',TALL.includes(pose.a));
  p.fx.innerHTML=FX[pose.fx]||'';}
function refreshPose(p){p.poseKey='';if(p.pose&&!p.leaving)applyPose(p,p.pose);}
function bubble(p,text,ms){p.bub.textContent=text;p.bub.classList.add('on');clearTimeout(p.bt);p.bt=setTimeout(()=>p.bub.classList.remove('on'),ms);}
function walkTo(p,pts,done){
  const cur=curXY(p);const seq=[cur,...pts];cancelAnim(p);
  let total=0;const segs=[];
  for(let i=1;i<seq.length;i++){const d=Math.hypot(seq[i][0]-seq[i-1][0],seq[i][1]-seq[i-1][1]);segs.push(d);total+=d;}
  const last=seq[seq.length-1];
  if(total<2){setPos(p,last[0],last[1]);done&&done();return;}
  p.walking=true;p.poseKey='';p.el.classList.add('walking');
  setFrames(p.spr,5,6,false,true);p.fx.innerHTML='';
  setPos(p,last[0],last[1]);p.el.classList.add('tall');
  let acc=0;
  const kf=seq.map((pt,i)=>{if(i>0)acc+=segs[i-1];return {left:(pt[0]-24)+'px',top:(pt[1]-64)+'px',zIndex:Math.round(pt[1]),offset:acc/total};});
  const a=p.anim=p.el.animate(kf,{duration:total/SPEED*1000,easing:'linear'});
  a.onfinish=()=>{if(p.anim!==a)return;p.anim=null;p.walking=false;p.el.classList.remove('walking');done&&done();};
}

/* ============================================================
   상태 → 몸짓
   ============================================================ */
function poseFor(s,ref){
  const el=(ref-toMs(s.started_at))/60000;
  switch(s.status){
    case 'working':return el>=LONG_MIN?{a:0,b:1,fx:'sweat'}:{a:0,b:1};
    case 'blocked':return {a:11,fx:'sweat'};
    case 'reporting':return {a:7,b:9,fx:'stars'};
    case 'idle':return {a:3,b:2,slow:true,fx:'rest'};
    default:return {a:4};}}
const STATUS_TXT={working:'작업 중',blocked:'막힘',reporting:'보고',idle:'대기'};
function infoFor(s,ref){
  const el=(ref-toMs(s.started_at))/60000;
  if(s.status==='working')return fmtMin(el)+(el>=LONG_MIN?' ⚠':'');
  return STATUS_TXT[s.status]||s.status||'?';}
function waitPose(w){return w>=CROUCH_WAIT?{a:8,fx:'sweat2'}:w>=SWEAT_WAIT?{a:4,fx:'sweat'}:{a:4};}

/* ============================================================
   층 구성 / 엘리베이터
   ============================================================ */
const vp=$('#vp'),shaft=$('#shaft');
let defs=[],views=[],curId='__lobby',curIdx=0,H=400,defSig='';
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
function buildDefs(d){
  const work=[],seen=new Set();
  (d.floors||[]).forEach(f=>{if(!seen.has(f.id)){seen.add(f.id);work.push({id:f.id,name:f.name||f.id});}});
  (d.sessions||[]).forEach(s=>{if(s.floor&&!seen.has(s.floor)){seen.add(s.floor);work.push({id:s.floor,name:s.floor});}});
  const out=[{id:'__ceo',label:'대표실',short:'대표',name:'질문은 여기로',mode:'ceo'}];
  for(let i=work.length-1;i>=0;i--)out.push({id:work[i].id,label:`${i+2}층`,short:`${i+2}F`,name:work[i].name,mode:'work'});
  out.push({id:'__lobby',label:'1층 로비',short:'1F',name:'전체',mode:'work'});
  return out;}
function setDefs(d){
  const nd=buildDefs(d||{}),sig=JSON.stringify(nd);
  if(sig===defSig)return false;
  defSig=sig;defs=nd;
  shaft.innerHTML='';
  views=defs.map((df,i)=>{const v=new View(df,i);shaft.appendChild(v.el);return v;});
  if(!defs.some(x=>x.id===curId))curId='__lobby';
  renderNav();layout();goto(curId,true);
  setDayOver(dayOver,true,true);
  return true;}
function renderNav(){
  const b=$('#btns');b.innerHTML='';
  defs.forEach(df=>{const e=document.createElement('button');e.className='fb';e.dataset.id=df.id;
    e.innerHTML='<span class="fn"></span><span class="fs"></span><span class="bd"></span>';
    $('.fn',e).textContent=df.id==='__ceo'?'대표실':df.id==='__lobby'?'1층':df.label;
    $('.fs',e).textContent=df.id==='__ceo'?'질문':df.id==='__lobby'?'로비':df.name;
    e.onclick=()=>goto(df.id);b.appendChild(e);});}
function layout(){
  const W=vp.clientWidth;H=vp.clientHeight;
  const s=Math.min(W/800,H/520)*.98;
  shaft.style.setProperty('--s',s);
  views.forEach(v=>{v.el.style.height=H+'px';v.el.style.top=(v.idx*H)+'px';});
  shaft.style.transition='none';shaft.style.transform=`translateY(${-curIdx*H}px)`;
  void shaft.offsetHeight;shaft.style.transition='';}
let indTimers=[];
function goto(id,instant){
  const i=defs.findIndex(f=>f.id===id);if(i<0)return;
  const from=curIdx,dist=Math.abs(i-from);curId=id;curIdx=i;
  $('#btns').querySelectorAll('.fb').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  indTimers.forEach(clearTimeout);indTimers=[];
  const dur=instant||reduced?0:700+dist*330;
  shaft.style.setProperty('--dur',dur+'ms');
  shaft.style.transform=`translateY(${-i*H}px)`;
  const arr=$('#arr'),n=$('#indn');
  if(dist===0||instant){arr.textContent='';n.textContent=defs[i].short;return;}
  const up=i<from;arr.textContent=up?'▲':'▼';
  for(let k=1;k<=dist;k++){const j=from+(up?-k:k);
    indTimers.push(setTimeout(()=>{n.textContent=defs[j].short;},dur*(k-.6)/dist));}
  indTimers.push(setTimeout(()=>{arr.textContent='';},dur+60));
  vp.classList.add('moving');indTimers.push(setTimeout(()=>vp.classList.remove('moving'),dur));
}
addEventListener('resize',layout);
new ResizeObserver(layout).observe(vp);
addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'&&curIdx>0)goto(defs[curIdx-1].id);
  if(e.key==='ArrowDown'&&curIdx<defs.length-1)goto(defs[curIdx+1].id);});

/* ---------- 퇴근: 방마다 차례로 소등 ---------- */
let dayOver=false,dayTok=0;
function setDayOver(flag,instant,force){
  if(flag===dayOver&&!force)return;
  dayOver=flag;const tok=++dayTok;
  $('#over').hidden=!flag;
  views.forEach(v=>v.rooms.forEach((poly,i)=>{
    if(!flag){poly.classList.remove('off');poly.classList.remove('nt');return;}
    if(instant){poly.classList.add('nt','off');return;}
    poly.classList.remove('nt');
    later(()=>{if(tok===dayTok)poly.classList.add('off');},(i+1)*1200);}));
}

/* ============================================================
   데이터 반영
   ============================================================ */
let latest=null,applied=null;
function apply(d){
  const ref=d.__ts;
  const sessions=(d.sessions||[]).filter(s=>!ENDED.includes(s.status));
  const qs=(d.questions||[]).slice().sort((a,b)=>toMs(a.asked_at)-toMs(b.asked_at));
  const byId=new Map((d.sessions||[]).map(s=>[s.id,s]));
  const asking=new Set(qs.map(q=>q.session));
  const first=setDefs(d);
  for(const v of views){
    let items;
    if(v.mode==='ceo'){
      items=[{key:'__me',kind:'ceo',palKey:'me',tagName:'대표(나)',tagInfo:qs.length?`대기 ${qs.length}명`:'',
        pose:qs.length?{a:0,b:1}:{a:3,b:2,slow:true,fx:'rest'}}];
      qs.forEach((q,i)=>{const s=byId.get(q.session)||{};const w=(ref-toMs(q.asked_at))/60000;
        items.push({key:'q:'+q.id,kind:'queue',qi:i,enter:true,palKey:q.session,tagName:s.name||q.session||'?',
          tagInfo:`대기 ${fmtMin(w)}`,title:q.text||'',greet:'❓ '+(q.text||'질문이 있어요'),pose:waitPose(w)});});
    }else{
      items=sessions.filter(s=>v.id==='__lobby'||s.floor===v.id).map(s=>{
        const away=asking.has(s.id);
        return {key:s.id,kind:'desk',role:s.role,enter:s.role==='sub',palKey:s.id,away,
          tagName:s.name||s.id,tagInfo:away?'대표실 대기':infoFor(s,ref),
          title:`${s.name||s.id} — ${STATUS_TXT[s.status]||s.status}`,greet:'출근합니다!',
          pose:away?{a:4,fx:'away'}:poseFor(s,ref)};});
    }
    v.reconcile(items);
  }
  setDayOver(!!d.day_over,!applied);
  // 버튼 배지
  $('#btns').querySelectorAll('.fb').forEach(b=>{
    const id=b.dataset.id;let t='';
    if(id==='__ceo')t=qs.length?`❓ ${qs.length}`:'';
    else{const n=sessions.filter(s=>id==='__lobby'||s.floor===id).length;t=n?`👤 ${n}`:'';}
    $('.bd',b).textContent=t;});
  const cnt=k=>sessions.filter(s=>s.status===k).length;
  $('#sum').textContent=`세션 ${sessions.length} · 작업 ${cnt('working')} · 보고 ${cnt('reporting')} · 대기 ${cnt('idle')} · 막힘 ${cnt('blocked')} · 질문 ${qs.length}`;
  applied=d;
}

/* ============================================================
   폴링 + '확인 중'(정지) 판정
   ============================================================ */
let offset=0,lastTs=null,lastChange=0,lastErr='',demoCut=false,lastDemo=null;
const SPAN_ERR={};
async function poll(){
  try{
    let d;
    if(DEMO){
      if(demoCut&&lastDemo)d=lastDemo;else{d=demoState();lastDemo=d;}offset=0;
    }else{
      const ac=new AbortController(),to=setTimeout(()=>ac.abort(),2500);
      const r=await fetch(SRC+(SRC.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store',signal:ac.signal});
      clearTimeout(to);
      if(!r.ok)throw new Error('HTTP '+r.status);
      d=await r.json();
      const dh=r.headers.get('date');const sd=dh?Date.parse(dh):NaN;offset=isNaN(sd)?0:sd-Date.now();
    }
    const ts=toMs(d.updated_at);
    if(isNaN(ts))throw new Error('updated_at 값이 없어요');
    d.__ts=ts;lastErr='';
    if(ts!==lastTs){lastTs=ts;lastChange=Date.now();}
    latest=d;
  }catch(e){lastErr=e.name==='AbortError'?'응답 시간 초과':e.message;}
  evaluate();
  setTimeout(poll,1000);
}
function evaluate(){
  const now=Date.now();
  const age=latest?(now+offset-latest.__ts):Infinity;
  const unchanged=now-lastChange;
  const isStale=!latest||age>STALE_MS||unchanged>STALE_MS;
  setStale(isStale);
  if(!isStale&&latest&&applied!==latest)apply(latest);
  // 표시
  const pill=$('#live');pill.classList.toggle('stale',isStale);
  $('#liveTxt').textContent=isStale?'확인 중':(DEMO?'데모 · 실시간':'실시간');
  $('#clock').textContent=latest?`마지막 갱신 ${new Date(latest.__ts).toLocaleTimeString('ko-KR')}`:'자료 없음';
  const sec=Math.max(0,Math.floor((isStale?Math.min(age,unchanged>age?unchanged:age):0)/1000));
  $('#banner').textContent=!latest?`확인 중 — 상태 자료를 아직 못 읽었어요${lastErr?` (${lastErr})`:''}`
    :`확인 중 — 자료가 ${isFinite(sec)?sec:'?'}초째 갱신되지 않아 움직임을 멈췄어요${lastErr?` (${lastErr})`:''}`;
  const em=$('#empty');em.style.display=latest?'none':'block';
  em.innerHTML=latest?'':`<div style="font-size:38px">🔌</div>${DEMO?'':'<b>'+SRC+'</b> 를 읽는 중…<br><span style="font-size:12px">아직 자료가 없어요. 「데모 보기」로 화면을 먼저 볼 수 있어요.</span>'}`;
}
function setStale(b){
  if(b===stale)return;
  stale=b;vp.classList.toggle('stale',b);
  const as=[...document.querySelectorAll('.actors')].flatMap(a=>a.getAnimations({subtree:true}));
  if(b)as.forEach(a=>a.pause());
  else{as.forEach(a=>{if(a.playState==='paused')a.play();});
    while(deferred.length)deferred.shift()();}
}
setInterval(evaluate,500);

/* ============================================================
   데모(가짜 데이터) — '데모 보기'를 눌렀을 때만 쓴다.
   1초 = 1분 속도로 흘러가는 130초 시나리오.
   ============================================================ */
let demoT0=Date.now()-(parseFloat(params.get('t'))||0)*1000;
function demoState(){
  const now=Date.now(),tt=((now-demoT0)/1000)%130,on=(a,b)=>tt>=a&&tt<b,ago=m=>now-m*60000;
  const S=[],Q=[];
  S.push({id:'m1',name:'로그인 구현',floor:'web',role:'main',status:tt<50?'working':tt<58?'reporting':'idle',started_at:ago(24+tt)});
  S.push({id:'m2',name:'매출 리포트',floor:'data',role:'main',status:tt<22?'working':tt<45?'blocked':'working',started_at:ago(3+tt)});
  S.push({id:'m3',name:'배포 파이프라인',floor:'infra',role:'main',status:tt<30?'idle':'working',started_at:ago(tt<30?0:tt-30)});
  S.push({id:'m4',name:'결제 모듈',floor:'web',role:'main',status:'working',started_at:ago(30+tt)});
  if(on(8,48))S.push({id:'s1',name:'테스트 작성',floor:'web',role:'sub',parent:'m1',status:'working',started_at:ago(tt-8)});
  if(on(14,70))S.push({id:'s2',name:'데이터 정제',floor:'data',role:'sub',parent:'m2',status:tt<60?'working':'reporting',started_at:ago(tt-14)});
  if(on(34,80))S.push({id:'s3',name:'이미지 빌드',floor:'infra',role:'sub',parent:'m3',status:'working',started_at:ago(tt-34)});
  if(on(12,80))Q.push({id:'q1',session:'m4',text:'결제 PG사는 어디로 할까요?',asked_at:ago(tt-12)});
  if(on(24,60))Q.push({id:'q2',session:'m2',text:'이상치 행을 삭제할까요?',asked_at:ago(tt-24)});
  if(on(58,95))Q.push({id:'q3',session:'m1',text:'OAuth 공급자를 추가할까요?',asked_at:ago(tt-58)});
  return {updated_at:now,day_over:tt>=105,floors:[{id:'web',name:'웹 개발'},{id:'data',name:'데이터 분석'},{id:'infra',name:'인프라'}],sessions:S,questions:Q};
}
function resetAll(){
  latest=null;applied=null;lastTs=null;lastChange=0;stale=true;vp.classList.add('stale');
  dayOver=false;defSig='';setDefs({});
}
function syncDemoUi(){
  $('#demoBtn').textContent=DEMO?'실제 자료로 돌아가기':'데모 보기';
  $('#cut').hidden=!DEMO;$('#cut').textContent=demoCut?'자료 다시 잇기':'자료 끊기(테스트)';}
$('#demoBtn').onclick=()=>{DEMO=!DEMO;demoCut=false;demoT0=Date.now();resetAll();syncDemoUi();};
$('#cut').onclick=()=>{demoCut=!demoCut;syncDemoUi();};

/* ---------- 시작 ---------- */
makeSheets();setDefs({});syncDemoUi();vp.classList.add('stale');
window.__office={get views(){return views;},get defs(){return defs;},goto};
poll();
})();
</script>
