<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b1b3a;
        --ink: #ffffff;
        --muted: #9fb0cf;
        --bar: #4f8ff7;
        --alert: #e53935;
        --font: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; background: var(--ground); font-family: var(--font); color: var(--ink); }
      #title { position: absolute; left: 140px; top: 440px; font-size: 96px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; transform-origin: 0 0; opacity: 0; }
      #rule { position: absolute; left: 140px; top: 190px; width: 0; height: 4px; background: var(--bar); }
      .row { position: absolute; left: 140px; width: 1640px; height: 96px; display: flex; align-items: center; opacity: 0; }
      .label { width: 340px; font-size: 40px; font-weight: 600; }
      .track { width: 1000px; height: 72px; background: rgba(255,255,255,0.07); border-radius: 8px; }
      .bar { width: 0; height: 72px; background: var(--bar); border-radius: 8px; transform-origin: 0 50%; }
      .bar.top { background: var(--bar); }
      .pct { width: 200px; padding-left: 28px; font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; }
      #glow { position: absolute; left: 480px; top: 300px; width: 1000px; height: 96px; border-radius: 12px; border: 4px solid var(--alert); opacity: 0; }
      #badge { position: absolute; left: 140px; top: 960px; font-size: 34px; color: var(--muted); opacity: 0; }
      #badge b { color: var(--alert); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <h1 id="title" class="clip" data-start="0" data-duration="15" data-track-index="0">Weekly Defect Summary - CBUS</h1>
      <div id="rule" class="clip" data-start="0" data-duration="15" data-track-index="1"></div>
      <div id="glow" class="clip" data-start="0" data-duration="15" data-track-index="2"></div>
      <div class="row" id="row0" style="top:300px">
        <div class="label" id="lab0">Skip Stitch</div>
        <div class="track"><div class="bar top" id="bar0"></div></div>
        <div class="pct" id="pct0">0%</div>
      </div>
      <div class="row" id="row1" style="top:436px">
        <div class="label" id="lab1">Oil Stain</div>
        <div class="track"><div class="bar" id="bar1"></div></div>
        <div class="pct" id="pct1">0%</div>
      </div>
      <div class="row" id="row2" style="top:572px">
        <div class="label" id="lab2">Broken Stitch</div>
        <div class="track"><div class="bar" id="bar2"></div></div>
        <div class="pct" id="pct2">0%</div>
      </div>
      <div class="row" id="row3" style="top:708px">
        <div class="label" id="lab3">Puckering</div>
        <div class="track"><div class="bar" id="bar3"></div></div>
        <div class="pct" id="pct3">0%</div>
      </div>
      <div class="row" id="row4" style="top:844px">
        <div class="label" id="lab4">Uneven Hem</div>
        <div class="track"><div class="bar" id="bar4"></div></div>
        <div class="pct" id="pct4">0%</div>
      </div>
      <div id="badge" class="clip" data-start="0" data-duration="15" data-track-index="3"><b>Skip Stitch</b> is the #1 defect at 32% of total</div>
    </div>
    <script>
      const data = [32, 24, 18, 15, 11];
      const PX = 1000 / 40; // 40% fills the track
      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0-3s): title fades in from the left
      tl.fromTo("#title", { opacity: 0, x: -160 }, { opacity: 1, x: 0, duration: 1.2, ease: "power3.out" }, 0.2);

      // Scene 2 (3-11s): title moves up, bars grow one by one
      tl.to("#title", { y: -350, scale: 0.55, duration: 0.8, ease: "power2.inOut" }, 3);
      tl.to("#rule", { width: 1640, duration: 0.8, ease: "power2.out" }, 3.2);
      data.forEach((v, i) => {
        const t = 4 + i * 1.4;
        tl.to("#row" + i, { opacity: 1, duration: 0.4, ease: "power1.out" }, t);
        tl.to("#bar" + i, { width: v * PX, duration: 1.1, ease: "power2.out" }, t);
        const c = { n: 0 };
        tl.to(c, { n: v, duration: 1.1, ease: "power2.out",
          onUpdate: () => { document.getElementById("pct" + i).textContent = Math.round(c.n) + "%"; } }, t);
      });

      // Scene 3 (11-15s): highlight the top defect in red, pulsing
      tl.to([ "#row1", "#row2", "#row3", "#row4" ], { opacity: 0.3, duration: 0.6 }, 11);
      tl.to("#bar0", { backgroundColor: "#e53935", duration: 0.6 }, 11);
      tl.to("#pct0", { color: "#ff5a52", duration: 0.6 }, 11);
      tl.to("#badge", { opacity: 1, duration: 0.6 }, 11.4);
      tl.fromTo("#glow", { opacity: 0, scaleX: 1, scaleY: 1 }, { opacity: 0.9, scaleX: 1.03, scaleY: 1.25, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 11.6);
      tl.fromTo("#bar0", { scaleY: 1 }, { scaleY: 1.12, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 11.6);
      tl.set("#glow", { opacity: 0 }, 14.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
