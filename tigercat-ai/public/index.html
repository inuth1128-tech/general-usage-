<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tigercat-ai 업무사이트</title>
<style>
  :root { --bg:#0a0a0a; --card:#141414; --line:#2a2a2a; --text:#f2f2f2; --mute:#9a9a9a; --red:#ff3b30; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, "Malgun Gothic", sans-serif; line-height:1.5; }
  header { padding:28px 20px 12px; max-width:1000px; margin:0 auto; }
  h1 { margin:0; font-size:26px; letter-spacing:.5px; }
  h1 span { color:var(--red); }
  .sub { color:var(--mute); margin-top:4px; }
  main { max-width:1000px; margin:0 auto; padding:0 20px 60px; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin:18px 0 26px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 18px; min-width:120px; }
  .stat b { font-size:24px; display:block; }
  .stat small { color:var(--mute); }
  h2 { font-size:16px; color:var(--mute); font-weight:600; margin:28px 0 12px; }
  .ceo { text-align:center; }
  .node { display:inline-block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 18px; }
  .node.sec { border-color:var(--red); }
  .line { width:1px; height:22px; background:var(--line); margin:0 auto; }
  .team { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; border-top:1px solid var(--line); padding-top:18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .card h3 { margin:0; font-size:18px; }
  .card h3 small { color:var(--red); font-size:13px; margin-left:6px; font-weight:600; }
  .card p { color:#cfcfcf; font-size:14px; margin:10px 0 0; }
  .tag { display:inline-block; font-size:12px; color:var(--mute); border:1px solid var(--line); border-radius:999px; padding:1px 9px; margin:8px 6px 0 0; }
  .note { margin-top:30px; color:var(--mute); font-size:13px; border-top:1px solid var(--line); padding-top:16px; }
  #err { color:var(--red); }
  textarea { width:100%; min-height:90px; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:12px; font:inherit; resize:vertical; }
  button { background:var(--red); color:#fff; border:0; border-radius:10px; padding:10px 20px; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; align-items:center; gap:14px; margin-top:10px; flex-wrap:wrap; }
  .usage { color:var(--mute); font-size:13px; }
  select, input.f { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font:inherit; }
  input.f { width:100%; margin:4px 0; } textarea.f { min-height:70px; margin:4px 0; }
  button.sub { background:transparent; border:1px solid var(--line); color:var(--text); padding:6px 14px; font-weight:600; }
  button.ok { background:#1f8f43; } .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .off { opacity:.45; }
  .st-approved { color:#34c759; } .st-rejected { color:var(--red); }
  .task { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .task .head { display:flex; justify-content:space-between; gap:10px; color:var(--mute); font-size:13px; }
  .task .ins { font-weight:700; margin:6px 0; }
  .task pre { white-space:pre-wrap; word-break:break-word; margin:8px 0 0; font:inherit; color:#d8d8d8; border-top:1px solid var(--line); padding-top:10px; }
  .st-working, .st-requested { color:#ffcc00; } .st-reported { color:#34c759; } .st-failed { color:var(--red); }
</style>
</head>
<body>
<header>
  <h1>tigercat<span>-ai</span> 업무사이트</h1>
  <div class="sub">4단계: 직원 채용 — 직원에게 일을 시키고, 승인/반려로 가르칩니다 (내 컴퓨터에서만 열립니다)</div>
</header>
<main>
  <div id="err"></div>
  <div class="stats" id="stats"></div>

  <h2>업무 지시하기</h2>
  <textarea id="ins" placeholder="예) 첫 번째 쇼츠 주제 3개를 제안해 줘. 주제는 '실패해도 계속하는 이유' 같은 동기부여로."></textarea>
  <div class="row">
    <select id="who"></select>
    <button id="send">지시 보내기</button>
    <span class="usage" id="usage"></span>
  </div>

  <h2>업무 기록</h2>
  <div id="tasks"></div>

  <h2>조직도</h2>
  <div class="ceo">
    <div class="node"><b>대표 (CEO)</b></div>
    <div class="line"></div>
    <div id="sec"></div>
    <div class="line"></div>
    <div class="team" id="team"></div>
  </div>

  <h2>직원 명부</h2>
  <div class="grid" id="grid"></div>

  <div class="note">
    다음 단계(5단계)에서 직원들이 회의를 열어 토론하고 회의록을 남기는 메신저가 추가됩니다.
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function get(path) { const r = await fetch(path); if (!r.ok) throw new Error(path + ' ' + r.status); return r.json(); }

const STATUS = { requested: '접수됨', working: '처리 중…', reported: '보고 완료 · 확인 필요', approved: '승인됨', rejected: '반려됨', failed: '실패' };
let EMPS = [];
const who = (id) => (EMPS.find((e) => e.id === id) || { name: id }).name;
async function review(id, verdict) {
  let note = '';
  if (verdict === 'rejected') { note = prompt('반려 사유를 적어 주세요. 직원이 다음에 같은 실수를 하지 않게 기억합니다.'); if (note === null) return; }
  else { note = prompt('승인 메모 (비워 둬도 됩니다)') ?? ''; }
  const r = await fetch('/api/tasks/' + id + '/review', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ verdict, note }) });
  const j = await r.json(); if (!r.ok) alert(j.error);
  poll(); loadEmps();
}
async function refreshTasks() {
  const [tasks, sum] = await Promise.all([get('/api/tasks'), get('/api/summary')]);
  $('usage').textContent = `오늘 Claude 호출 ${sum.usage.used} / ${sum.usage.limit}회`;
  $('tasks').innerHTML = tasks.length ? tasks.map((t) => `
    <div class="task">
      <div class="head"><span>#${t.id} · ${esc(who(t.assignee_id))} · ${esc(t.created_at)}</span><span class="st-${esc(t.status)}">${STATUS[t.status] || esc(t.status)}</span></div>
      <div class="ins">${esc(t.instruction)}</div>
      ${t.result ? `<pre>${esc(t.result)}</pre>` : ''}
      ${t.status === 'reported' ? `<div class="actions"><button class="ok" onclick="review(${t.id},'approved')">승인</button><button class="sub" onclick="review(${t.id},'rejected')">반려(사유 입력)</button></div>` : ''}
    </div>`).join('') : '<div class="usage">아직 지시한 업무가 없습니다.</div>';
  return tasks.some((t) => t.status === 'working' || t.status === 'requested');
}
let timer = null;
async function poll() {
  try { const running = await refreshTasks(); clearTimeout(timer); if (running) timer = setTimeout(poll, 2500); else $('send').disabled = false; } catch (e) { $('err').textContent = e.message; }
}
$('send').onclick = async () => {
  const instruction = $('ins').value.trim();
  if (!instruction) return;
  $('send').disabled = true; $('err').textContent = '';
  const r = await fetch('/api/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instruction, assignee: $('who').value }) });
  const j = await r.json();
  if (!r.ok) { $('err').textContent = j.error; $('send').disabled = false; return; }
  $('ins').value = '';
  poll();
};
function renderEmps() {
  const emps = EMPS;
  const sec = emps.find((e) => e.id === 'secretary');
  $('sec').innerHTML = `<div class="node sec"><b>${esc(sec.name)}</b><br><small>${esc(sec.title)}</small></div>`;
  $('team').innerHTML = emps.filter((e) => e.id !== 'secretary')
    .map((e) => `<div class="node ${e.active ? '' : 'off'}"><b>${esc(e.name)}</b><br><small>${esc(e.title)}${e.active ? '' : ' (휴직)'}</small></div>`).join('');
  $('who').innerHTML = emps.filter((e) => e.active).map((e) => `<option value="${esc(e.id)}">${esc(e.name)} (${esc(e.title)})에게</option>`).join('');
  $('grid').innerHTML = emps.map((e) => `
    <div class="card ${e.active ? '' : 'off'}" id="c-${esc(e.id)}">
      <h3>${esc(e.name)}<small>${esc(e.title)}</small></h3>
      <p>${esc(e.role)}</p>
      <span class="tag">두뇌: ${esc(e.engine)}</span>
      ${e.tools ? e.tools.split(',').map((t) => `<span class="tag">${esc(t)}</span>`).join('') : ''}
      <div class="actions"><button class="sub" onclick="editEmp('${esc(e.id)}')">수정</button>
      ${e.id === 'secretary' ? '' : `<button class="sub" onclick="toggleEmp('${esc(e.id)}')">${e.active ? '휴직시키기' : '복직시키기'}</button>`}</div>
    </div>`).join('');
}
async function loadEmps() { EMPS = await get('/api/employees'); renderEmps(); }
async function saveEmp(id, body) {
  const r = await fetch('/api/employees/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) { alert(j.error); return false; }
  await loadEmps(); poll(); return true;
}
function toggleEmp(id) { const e = EMPS.find((x) => x.id === id); saveEmp(id, { active: !e.active }); }
function editEmp(id) {
  const e = EMPS.find((x) => x.id === id);
  $('c-' + id).innerHTML = `
    <input class="f" id="e-name" value="${esc(e.name)}" placeholder="이름">
    <input class="f" id="e-title" value="${esc(e.title)}" placeholder="직함">
    <textarea class="f" id="e-role" placeholder="맡은 업무">${esc(e.role)}</textarea>
    <textarea class="f" id="e-persona" placeholder="성격/말투">${esc(e.persona)}</textarea>
    <div class="actions"><button onclick="saveEmp('${esc(id)}', {name:$('e-name').value,title:$('e-title').value,role:$('e-role').value,persona:$('e-persona').value})">저장</button>
    <button class="sub" onclick="renderEmps()">취소</button></div>`;
}
(async () => {
  try {
    await loadEmps();
    const sum = await get('/api/summary');
    $('stats').innerHTML = [['직원', sum.employees], ['업무', sum.tasks], ['기억', sum.memories]]
      .map(([k, v]) => `<div class="stat"><b>${v}</b><small>${k}</small></div>`).join('');
    poll();
  } catch (e) {
    $('err').textContent = '서버에 연결하지 못했습니다: ' + e.message;
  }
})();
</script>
</body>
</html>
